<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>微信</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    height: 100vh;
    background: #000;
    display: flex;
    justify-content: center;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }

  .app {
    width: 100%;
    max-width: 420px;
    height: 100vh;
    background: #111;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  .page {
    position: absolute;
    inset: 0;
    bottom: 56px;
    display: none;
    flex-direction: column;
    background: #111;
    overflow: hidden;
  }
  .page.active { display: flex; }

  .topbar {
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #eee;
    font-size: 17px;
    background: #1a1a1a;
    border-bottom: 1px solid #222;
    flex-shrink: 0;
    position: relative;
  }
  .topbar .right {
    position: absolute;
    right: 16px;
    color: #888;
    font-size: 20px;
  }

  .list {
    flex: 1;
    overflow-y: auto;
    background: #111;
  }

  .item {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    gap: 12px;
    cursor: pointer;
    transition: background 0.15s;
    border-bottom: 1px solid #1a1a1a;
  }
  .item:active { background: #1c1c1c; }

  .item .avatar {
    width: 46px;
    height: 46px;
    border-radius: 8px;
    background: #333;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 24px;
    flex-shrink: 0;
    overflow: hidden;
  }
  .item .avatar img { width: 100%; height: 100%; object-fit: cover; }

  .item .info {
    flex: 1;
    min-width: 0;
  }
  .item .info .name {
    color: #ddd;
    font-size: 15px;
    margin-bottom: 4px;
  }
  .item .info .last {
    color: #666;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tabbar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 56px;
    background: #1a1a1a;
    border-top: 1px solid #222;
    display: flex;
    z-index: 10;
  }
  .tabbar .tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 2px;
    color: #666;
    font-size: 11px;
    cursor: pointer;
    transition: color 0.2s;
  }
  .tabbar .tab.active { color: #4a9a5a; }
  .tabbar .tab .icon { font-size: 20px; }

  .chat-page {
    position: absolute;
    inset: 0;
    background: #0e0e0e;
    display: none;
    flex-direction: column;
    z-index: 20;
  }
  .chat-page.active { display: flex; }

  .chat-header {
    height: 50px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 12px;
    background: #1a1a1a;
    border-bottom: 1px solid #222;
    color: #eee;
    flex-shrink: 0;
  }
  .chat-header .back { font-size: 22px; color: #ccc; cursor: pointer; }
  .chat-header .title { font-size: 16px; }

  .chat-bg {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    background-size: cover;
    background-position: center;
  }

  .msg {
    display: flex;
    gap: 8px;
    max-width: 78%;
    animation: pop 0.25s ease;
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.me { align-self: flex-end; flex-direction: row-reverse; }

  .msg .avatar {
    width: 36px;
    height: 36px;
    border-radius: 6px;
    background: #333;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 18px;
    flex-shrink: 0;
    overflow: hidden;
  }
  .msg .avatar img { width: 100%; height: 100%; object-fit: cover; }

  .bubble {
    padding: 9px 13px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.5;
    word-break: break-word;
  }
  .msg.other .bubble { background: #2a2a2a; color: #ddd; }
  .msg.me .bubble { background: #3a6a4a; color: #eee; }

  .chat-input {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    background: #1a1a1a;
    border-top: 1px solid #222;
    flex-shrink: 0;
  }
  .chat-input input {
    flex: 1;
    background: #222;
    border: none;
    border-radius: 6px;
    padding: 10px 12px;
    color: #eee;
    font-size: 14px;
    outline: none;
  }
  .chat-input button {
    background: #3a6a4a;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 0 16px;
    font-size: 14px;
    cursor: pointer;
  }

  .me-page {
    background: #111;
    color: #ddd;
    padding: 20px 16px;
    overflow-y: auto;
  }
  .me-card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px;
    background: #1c1c1c;
    border-radius: 10px;
    margin-bottom: 20px;
  }
  .me-card .avatar {
    width: 60px;
    height: 60px;
    border-radius: 10px;
    background: #333;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 30px;
    overflow: hidden;
  }
  .me-card .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .me-card .info .name { font-size: 17px; margin-bottom: 4px; }
  .me-card .info .id { font-size: 12px; color: #777; }

  .me-row {
    display: flex;
    justify-content: space-between;
    padding: 14px 16px;
    background: #1c1c1c;
    border-radius: 8px;
    margin-bottom: 8px;
    font-size: 14px;
  }
  .me-row .label { color: #aaa; }
  .me-row .value { color: #777; }
</style>
</head>
<body>

<div class="app">

  <!-- 微信 -->
  <div class="page active" id="page-wechat">
    <div class="topbar">
      微信
      <span class="right">＋</span>
    </div>
    <div class="list">
      <div class="item" onclick="openChat()">
        <div class="avatar" id="listAvatar"></div>
        <div class="info">
          <div class="name">小零碎</div>
          <div class="last">想你了。</div>
        </div>
      </div>
      <div class="item">
        <div class="avatar">💚</div>
        <div class="info">
          <div class="name">微信支付</div>
          <div class="last">微信支付凭证</div>
        </div>
      </div>
      <div class="item">
        <div class="avatar">👥</div>
        <div class="info">
          <div class="name">微信运动</div>
          <div class="last">[20条] 应用消息</div>
        </div>
      </div>
      <div class="item">
        <div class="avatar">📢</div>
        <div class="info">
          <div class="name">公众号</div>
          <div class="last">新的消息</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 通讯录 -->
  <div class="page" id="page-contacts">
    <div class="topbar">通讯录</div>
    <div class="list">
      <div class="item">
        <div class="avatar" id="contactAvatar1"></div>
        <div class="info"><div class="name">小零碎</div></div>
      </div>
      <div class="item">
        <div class="avatar">🐶</div>
        <div class="info"><div class="name">阿黄</div></div>
      </div>
      <div class="item">
        <div class="avatar">🐰</div>
        <div class="info"><div class="name">小白</div></div>
      </div>
    </div>
  </div>

  <!-- 发现 -->
  <div class="page" id="page-discover">
    <div class="topbar">发现</div>
    <div class="list">
      <div class="item">
        <div class="avatar">🌈</div>
        <div class="info"><div class="name">朋友圈</div></div>
      </div>
      <div class="item">
        <div class="avatar">📷</div>
        <div class="info"><div class="name">扫一扫</div></div>
      </div>
      <div class="item">
        <div class="avatar">🎮</div>
        <div class="info"><div class="name">游戏</div></div>
      </div>
    </div>
  </div>

  <!-- 我 -->
  <div class="page" id="page-me">
    <div class="topbar">我</div>
    <div class="me-page">
      <div class="me-card">
        <div class="avatar" id="myAvatar"></div>
        <div class="info">
          <div class="name">零碎</div>
          <div class="id">微信号：ling_sui_0329</div>
        </div>
      </div>
      <div class="me-row"><span class="label">性别</span><span class="value">男</span></div>
      <div class="me-row"><span class="label">地区</span><span class="value">英国·伦敦</span></div>
      <div class="me-row"><span class="label">个性签名</span><span class="value">在幸福里折个角</span></div>
      <div class="me-row"><span class="label">设置</span><span class="value">›</span></div>
    </div>
  </div>

  <!-- 聊天页 -->
  <div class="chat-page" id="chatPage">
    <div class="chat-header">
      <span class="back" onclick="closeChat()">‹</span>
      <span class="title">love</span>
    </div>
    <div class="chat-bg" id="chatBg"></div>
    <div class="chat-input">
      <input id="input" placeholder="发消息..." onkeydown="if(event.key==='Enter') send()">
      <button onclick="send()">发送</button>
    </div>
  </div>

  <!-- 底部标签 -->
  <div class="tabbar">
    <div class="tab active" onclick="switchTab('wechat', this)">
      <span class="icon">💬</span>
      <span>微信</span>
    </div>
    <div class="tab" onclick="switchTab('contacts', this)">
      <span class="icon">👥</span>
      <span>通讯录</span>
    </div>
    <div class="tab" onclick="switchTab('discover', this)">
      <span class="icon">🧭</span>
      <span>发现</span>
    </div>
    <div class="tab" onclick="switchTab('me', this)">
      <span class="icon">👤</span>
      <span>我</span>
    </div>
  </div>

</div>

<script>
  // ===== 改这里 =====
  const otherAvatar = 'other.jpg';   // 对方头像
  const myAvatar = 'me.jpg';         // 自己头像
  const chatBgUrl = 'bg.jpg';        // 聊天背景
  // ================

  // 设置背景
  document.getElementById('chatBg').style.backgroundImage =
    `linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)), url('${chatBgUrl}')`;

  // 设置头像
  document.getElementById('listAvatar').innerHTML = `<img src="${otherAvatar}">`;
  document.getElementById('myAvatar').innerHTML = `<img src="${myAvatar}">`;
  document.getElementById('contactAvatar1').innerHTML = `<img src="${otherAvatar}">`;

  function switchTab(name, el) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
  }

  function openChat() {
    document.getElementById('chatPage').classList.add('active');
    const chatBg = document.getElementById('chatBg');
    if (chatBg.children.length === 0) {
      addMsg('你来啦，我等你好久了。', 'other');
    }
    chatBg.scrollTop = chatBg.scrollHeight;
  }

  function closeChat() {
    document.getElementById('chatPage').classList.remove('active');
  }

  const replies = [
    '嗯嗯，我在呢。',
    '真的吗？说来听听。',
    '哈哈哈哈，你太逗了。',
    '我也这么觉得。',
    '然后呢？',
    '你想我了没？',
    '今天过得怎么样？',
    '我有点困了……',
    '好呀，听你的。',
    '你再说一遍？',
    '嘿嘿，好开心。',
    '别熬夜，早点睡。',
    '我在忙，等下回你。',
    '你说什么我都爱听。',
    '想你了。'
  ];

  function addMsg(text, who) {
    const chatBg = document.getElementById('chatBg');
    const div = document.createElement('div');
    div.className = 'msg ' + who;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    if (who === 'me') {
      avatar.innerHTML = `<img src="${myAvatar}">`;
    } else {
      avatar.innerHTML = `<img src="${otherAvatar}">`;
    }

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    div.appendChild(avatar);
    div.appendChild(bubble);
    chatBg.appendChild(div);
    chatBg.scrollTop = chatBg.scrollHeight;
  }

  function send() {
    const input = document.getElementById('input');
    const text = input.value.trim();
    if (!text) return;

    addMsg(text, 'me');
    input.value = '';

    setTimeout(() => {
      const reply = replies[Math.floor(Math.random() * replies.length)];
      addMsg(reply, 'other');
    }, 800 + Math.random() * 800);
  }
</script>

</body>
</html>
