<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人主页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #0d0b0a;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(120, 40, 30, 0.15), transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(80, 60, 20, 0.1), transparent 50%);
    color: #c9b99a;
    font-family: "Georgia", "Songti SC", "SimSun", serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
    position: relative;
    overflow-x: hidden;
  }

  #snowCanvas, #trailCanvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  #trailCanvas { z-index: 999; }

  .glow {
    position: fixed;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(180, 120, 60, 0.12), transparent 70%);
    pointer-events: none;
    transform: translate(-50%, -50%);
    transition: 0.15s ease-out;
    z-index: 0;
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    background: rgba(20, 16, 14, 0.9);
    border: 1px solid #3a2e24;
    border-radius: 4px;
    padding: 40px 32px 36px;
    box-shadow:
      0 0 0 1px rgba(180, 140, 80, 0.08),
      0 20px 60px rgba(0, 0, 0, 0.8);
    animation: fadeUp 1s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card::after {
    content: "";
    position: absolute;
    inset: 6px;
    border: 1px solid rgba(180, 140, 80, 0.12);
    border-radius: 2px;
    pointer-events: none;
  }

  .avatar-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 22px;
  }

  .avatar {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #5a4632;
    box-shadow: 0 0 24px rgba(160, 110, 50, 0.25);
    filter: sepia(0.3) contrast(1.05);
    transition: 0.4s;
  }

  .avatar:hover {
    transform: scale(1.05);
    box-shadow: 0 0 36px rgba(200, 150, 70, 0.4);
  }

  .name {
    text-align: center;
    font-size: 26px;
    letter-spacing: 4px;
    color: #d8c49a;
    margin-bottom: 8px;
    text-shadow: 0 0 12px rgba(180, 140, 80, 0.3);
  }

  .divider {
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #6a5438, transparent);
    margin: 0 auto 20px;
  }

  .bio {
    text-align: center;
    font-size: 14px;
    line-height: 1.9;
    color: #8f8068;
    margin-bottom: 12px;
    letter-spacing: 1px;
    min-height: 54px;
  }

  .clock {
    text-align: center;
    font-size: 12px;
    color: #5a4d3a;
    letter-spacing: 2px;
    margin-bottom: 24px;
  }

  .info {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    background: rgba(255, 255, 255, 0.02);
    border-left: 2px solid #4a3a28;
    font-size: 14px;
    letter-spacing: 1px;
    transition: 0.3s;
  }

  .row:hover {
    background: rgba(255, 255, 255, 0.05);
    border-left-color: #8a6a40;
  }

  .row .label { color: #6f6048; }
  .row .value { color: #c9b99a; }

  .links {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 28px;
    flex-wrap: wrap;
  }

  .links a {
    color: #8f8068;
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 1px;
    padding: 6px 12px;
    border: 1px solid #3a2e24;
    border-radius: 2px;
    transition: 0.3s;
    cursor: pointer;
  }

  .links a:hover {
    color: #d8c49a;
    border-color: #8a6a40;
    background: rgba(180, 140, 80, 0.06);
  }

  .footer {
    margin-top: 30px;
    text-align: center;
    font-size: 11px;
    color: #4a4034;
    letter-spacing: 2px;
  }

  .counter {
    margin-top: 10px;
    text-align: center;
    font-size: 11px;
    color: #4a4034;
    letter-spacing: 1px;
  }

  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    z-index: 2000;
    justify-content: center;
    align-items: center;
  }

  .modal.show {
    display: flex;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .modal-box {
    background: rgba(20, 16, 14, 0.98);
    border: 1px solid #5a4632;
    border-radius: 6px;
    padding: 30px 36px;
    text-align: center;
    box-shadow: 0 0 40px rgba(180, 140, 80, 0.2);
    animation: popIn 0.3s ease;
  }

  @keyframes popIn {
    from { transform: scale(0.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .modal-avatar {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #5a4632;
    margin-bottom: 16px;
  }

  .modal-text {
    color: #d8c49a;
    font-size: 16px;
    letter-spacing: 2px;
    margin-bottom: 20px;
  }

  .modal-box button {
    background: transparent;
    color: #8f8068;
    border: 1px solid #3a2e24;
    border-radius: 2px;
    padding: 6px 18px;
    font-size: 13px;
    letter-spacing: 1px;
    cursor: pointer;
    font-family: inherit;
    transition: 0.3s;
  }

  .modal-box button:hover {
    color: #d8c49a;
    border-color: #8a6a40;
  }
</style>
</head>
<body>

  <canvas id="snowCanvas"></canvas>
  <canvas id="trailCanvas"></canvas>
  <div class="glow" id="glow"></div>

  <div class="card">

    <div class="avatar-wrap">
      <img class="avatar" src="avatar.jpg" alt="头像">
    </div>

    <h1 class="name">零碎</h1>
    <div class="divider"></div>

    <p class="bio" id="bio"></p>
    <div class="clock" id="clock"></div>

    <div class="info">
      <div class="row">
        <span class="label">性别</span>
        <span class="value">男</span>
      </div>
      <div class="row">
        <span class="label">年龄</span>
        <span class="value">20</span>
      </div>
      <div class="row">
        <span class="label">IP地址</span>
        <span class="value">英国·伦敦</span>
      </div>
    </div>

    <div class="links">
      <a onclick="openModal()">微信</a>
      <a href="https://im.qq.com" target="_blank">QQ</a>
      <a href="https://www.bilibili.com" target="_blank">B站</a>
      <a href="https://weibo.com" target="_blank">微博</a>
    </div>

    <div class="footer">EST. 2026</div>
    <div class="counter">访问次数：<span id="count">0</span></div>

  </div>

  <div id="wechatModal" class="modal">
    <div class="modal-box">
      <img src="avatar.jpg" class="modal-avatar" alt="头像">
      <p class="modal-text">我想你了</p>
      <button onclick="closeModal()">关闭</button>
    </div>
  </div>

  <audio id="bgm" src="music.mp3" loop autoplay></audio>

<script>
  const glow = document.getElementById('glow');
  document.addEventListener('mousemove', e => {
    glow.style.left = e.clientX + 'px';
    glow.style.top = e.clientY + 'px';
  });

  const text = "在幸福里折个角。";
  const bio = document.getElementById('bio');
  let i = 0, typing = true;
  function typeLoop() {
    if (typing) {
      bio.textContent = text.slice(0, i);
      i++;
      if (i > text.length) {
        typing = false;
        setTimeout(typeLoop, 1500);
        return;
      }
    } else {
      bio.textContent = text.slice(0, i);
      i--;
      if (i < 0) {
        typing = true;
        setTimeout(typeLoop, 500);
        return;
      }
    }
    setTimeout(typeLoop, 100);
  }
  typeLoop();

  let count = localStorage.getItem('visits') || 0;
  count++;
  localStorage.setItem('visits', count);
  document.getElementById('count').textContent = count;

  function updateClock() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    const h = String(now.getHours()).padStart(2, '0');
    const mi = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');
    document.getElementById('clock').textContent = `${y}.${m}.${d} ${h}:${mi}:${s}`;
  }
  updateClock();
  setInterval(updateClock, 1000);

  document.addEventListener('click', function initAudio() {
    var bgm = document.getElementById('bgm');
    if (bgm.paused) bgm.play();
    document.removeEventListener('click', initAudio);
  }, { once: true });

  function openModal() {
    document.getElementById('wechatModal').classList.add('show');
  }
  function closeModal() {
    document.getElementById('wechatModal').classList.remove('show');
  }

  const snowCanvas = document.getElementById('snowCanvas');
  const snowCtx = snowCanvas.getContext('2d');
  let snowflakes = [];
  function resizeSnow() {
    snowCanvas.width = window.innerWidth;
    snowCanvas.height = window.innerHeight;
  }
  resizeSnow();
  window.addEventListener('resize', resizeSnow);
  for (let i = 0; i < 80; i++) {
    snowflakes.push({
      x: Math.random() * snowCanvas.width,
      y: Math.random() * snowCanvas.height,
      r: Math.random() * 2 + 0.5,
      d: Math.random() * 1 + 0.3,
      o: Math.random() * 0.5 + 0.2
    });
  }
  function drawSnow() {
    snowCtx.clearRect(0, 0, snowCanvas.width, snowCanvas.height);
    snowflakes.forEach(f => {
      snowCtx.beginPath();
      snowCtx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      snowCtx.fillStyle = `rgba(220, 210, 190, ${f.o})`;
      snowCtx.fill();
      f.y += f.d;
      f.x += Math.sin(f.y / 30) * 0.3;
      if (f.y > snowCanvas.height) {
        f.y = -5;
        f.x = Math.random() * snowCanvas.width;
      }
    });
    requestAnimationFrame(drawSnow);
  }
  drawSnow();

  const trailCanvas = document.getElementById('trailCanvas');
  const trailCtx = trailCanvas.getContext('2d');
  let stars = [];
  function resizeTrail() {
    trailCanvas.width = window.innerWidth;
    trailCanvas.height = window.innerHeight;
  }
  resizeTrail();
  window.addEventListener('resize', resizeTrail);
  function addStar(x, y) {
    stars.push({ x, y, life: 1, size: Math.random() * 3 + 1 });
    if (stars.length > 60) stars.shift();
  }
  document.addEventListener('mousemove', e => addStar(e.clientX, e.clientY));
  document.addEventListener('touchmove', e => {
    const t = e.touches[0];
    addStar(t.clientX, t.clientY);
  });
  function drawTrail() {
    trailCtx.clearRect(0, 0, trailCanvas.width, trailCanvas.height);
    stars.forEach(s => {
      trailCtx.beginPath();
      trailCtx.arc(s.x, s.y, s.size * s.life, 0, Math.PI * 2);
      trailCtx.fillStyle = `rgba(220, 190, 120, ${s.life})`;
      trailCtx.fill();
      s.life -= 0.025;
    });
    stars = stars.filter(s => s.life > 0);
    requestAnimationFrame(drawTrail);
  }
  drawTrail();

  document.addEventListener('click', e => {
    if (e.target.closest('#wechatModal')) return;
    for (let i = 0; i < 12; i++) {
      const snow = document.createElement('div');
      snow.textContent = '❄';
      snow.style.position = 'fixed';
      snow.style.left = e.clientX + 'px';
      snow.style.top = e.clientY + 'px';
      snow.style.color = '#d8c49a';
      snow.style.fontSize = (Math.random() * 12 + 8) + 'px';
      snow.style.pointerEvents = 'none';
      snow.style.zIndex = '1000';
      snow.style.transition = 'all 1s ease-out';
      document.body.appendChild(snow);
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.random() * 100 + 50;
      setTimeout(() => {
        snow.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`;
        snow.style.opacity = '0';
      }, 10);
      setTimeout(() => snow.remove(), 1100);
    }
  });
</script>

</body>
</html>
